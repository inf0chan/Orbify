<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbify — Music Visualizer</title>
  <meta name="description" content="Orbify — Spotify-style music player with a 3D spinning vinyl record that reacts to every beat." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/vinyl.css" />
</head>
<body>

<div id="app">

  <!-- ── Icon Sidebar ──────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo" title="Orbify">
      <svg viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="18" fill="url(#logoGrad)"/>
        <circle cx="20" cy="20" r="7"  fill="white" opacity="0.18"/>
        <circle cx="20" cy="20" r="3"  fill="white" opacity="0.85"/>
        <defs>
          <radialGradient id="logoGrad" cx="30%" cy="30%">
            <stop offset="0%"   stop-color="#d08bff"/>
            <stop offset="55%"  stop-color="#b026ff"/>
            <stop offset="100%" stop-color="#00e5ff"/>
          </radialGradient>
        </defs>
      </svg>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-btn active" id="nav-home" title="Home">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-btn" id="nav-search-btn" title="Search">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <span>Search</span>
      </button>
      <button class="nav-btn" id="nav-liked" title="Liked Songs">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <span>Liked</span>
      </button>
    </nav>

    <!-- Recent -->
    <div class="sidebar-section">Recent</div>
    <ul class="recent-list" id="recent-list">
      <li class="recent-empty">Search a song!</li>
    </ul>
  </aside>

  <!-- ── Main Canvas Area (orb lives here) ─────────────────────── -->
  <main class="main-area" id="main-area">

    <!-- The vinyl canvas – fills entire main area -->
    <canvas id="vinyl-canvas"></canvas>

    <!-- Floating search bar (top center) -->
    <div class="float-search" id="float-search">
      <div class="search-wrap" id="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search any song or artist…"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="search-clear" id="search-clear" aria-label="Clear">✕</button>
      </div>
    </div>

    <!-- Source badge -->
    <div class="source-badge" id="source-badge" style="display:none"></div>

    <!-- Results drawer (slides in from left) -->
    <div class="results-drawer" id="results-drawer">
      <div class="drawer-inner">
        <div class="drawer-header">
          <span class="drawer-title" id="drawer-title">Results</span>
          <span class="drawer-count" id="drawer-count"></span>
          <button class="drawer-close" id="drawer-close" title="Close">✕</button>
        </div>
        <div class="results-list" id="results-list">
          <!-- Injected by JS -->
        </div>
        <div class="drawer-loading" id="drawer-loading">
          <div class="loading-orb-mini"></div>
          <span>Searching…</span>
        </div>
        <div class="drawer-empty" id="drawer-empty" style="display:none">
          <div style="font-size:2.5rem;margin-bottom:12px">🎵</div>
          <p>No results found</p>
          <small>Try a different search term</small>
        </div>
      </div>
    </div>

    <!-- Now-playing overlay (bottom center of orb) -->
    <div class="now-playing-overlay" id="now-playing-overlay">
      <img class="np-artwork" id="np-artwork" src="" alt="" />
      <div class="np-meta">
        <div class="np-title"  id="np-title">—</div>
        <div class="np-artist" id="np-artist">—</div>
      </div>
    </div>

    <!-- Idle hint -->
    <div class="idle-hint" id="idle-hint">
      <span>Press <kbd>/</kbd> or click search to find music</span>
    </div>

  </main>

</div><!-- /#app -->

<!-- ═══════════════════════════════════════
     PLAYER BAR
════════════════════════════════════════ -->
<footer class="player-bar" id="player-bar">

  <!-- Track -->
  <div class="player-track">
    <img class="player-artwork" id="player-artwork" src="" alt="" />
    <div class="player-meta">
      <div class="player-title"  id="player-title">Select a song</div>
      <div class="player-artist" id="player-artist">—</div>
    </div>
    <button class="icon-btn like-btn" id="btn-like" title="Like (L)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
    </button>
  </div>

  <!-- Controls + Progress -->
  <div class="player-center">
    <div class="ctrl-row">
      <button class="icon-btn" id="btn-shuffle" title="Shuffle">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button class="icon-btn" id="btn-prev" title="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="icon-btn play-pause-btn" id="btn-play" title="Play (Space)">
        <svg class="icon-play"  viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="icon-btn" id="btn-next" title="Next (→)">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
      <button class="icon-btn" id="btn-repeat" title="Repeat">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>
    <div class="progress-row">
      <span class="time" id="time-cur">0:00</span>
      <div class="progress-track" id="progress-track">
        <div class="waveform" id="waveform"></div>
      </div>
      <span class="time" id="time-tot">0:00</span>
    </div>
  </div>

  <!-- Volume -->
  <div class="player-right">
    <button class="icon-btn" id="btn-mute" title="Mute (M)">
      <svg class="icon-vol"  viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      <svg class="icon-mute" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
    </button>
    <div class="vol-track" id="vol-track">
      <div class="vol-fill" id="vol-fill" style="width:80%"></div>
      <div class="vol-thumb" id="vol-thumb" style="left:80%"></div>
    </div>
  </div>

</footer>

<!-- Hidden audio element -->
<!-- preload="auto" so the browser starts buffering as soon as src is set —
     this dramatically cuts the gap when switching/starting tracks. -->
<audio id="audio-el" crossorigin="anonymous" preload="auto"></audio>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Scripts -->
<script src="/js/api.js"></script>
<script src="/js/player.js"></script>
<script src="/js/vinyl.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/app.js"></script>

</body>
</html>
